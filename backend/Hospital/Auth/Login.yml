info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{url}}/auth/login"
  body:
    type: json
    data: |-
      {
          "email": "mail@mail.com",
          "password": "aaa"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody()
        bru.setEnvVar("token", body.data.token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
